version: '3'
services:
  xoj-gateway:
    container_name: xoj-gateway
    build:
      context: xoj-gateway
      dockerfile: Dockerfile
    ports:
      - "8101:8101"
    networks:
      - mynetwork

  xoj-user-service:
    container_name: xoj-user-service
    build:
      context: ./xoj-user-service
      dockerfile: Dockerfile
    ports:
      - "8102:8102"
    networks:
      - mynetwork
    depends_on:
      - xoj-gateway

  xoj-question-service:
    container_name: xoj-question-service
    build:
      context: xoj-question-service
      dockerfile: Dockerfile
    ports:
      - "8103:8103"
    networks:
      - mynetwork
    depends_on:
      - xoj-user-service
      - xoj-gateway

  xoj-judge-service:
    container_name: xoj-judge-service
    build:
      context: xoj-judge-service
      dockerfile: Dockerfile
    ports:
      - "8104:8104"
    networks:
      - mynetwork
    depends_on:
      - xoj-user-service
      - xoj-question-service
      - xoj-gateway

  xoj-competition-service:
    container_name: xoj-competition-service
    build:
      context: xoj-competition-service
      dockerfile: Dockerfile
    ports:
      - "8105:8105"
    networks:
      - mynetwork
    depends_on:
      - xoj-user-service
      - xoj-question-service
      - xoj-gateway

# 网络，不定义的话就是默认网络
networks:
  mynetwork:
